<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Saturn - Local Chat App</title>
    <style>
        /* Discord-like CSS styling */
        /* Networking Layer 7: CSS ko load karne ke liye HTTP request */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #36393f;
            color: #dcddde;
            overflow: hidden;
            height: 100vh;
        }

        /* Main Discord-like layout */
        .discord-app {
            display: flex;
            height: 100vh;
        }

        /* Left Sidebar - Servers */
        .servers-sidebar {
            width: 72px;
            background-color: #202225;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            border-right: 1px solid #202225;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: #36393f;
            border-radius: 50%;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
            position: relative;
        }

        .server-icon:hover {
            background-color: #5865f2;
            border-radius: 16px;
        }

        .server-icon.active {
            background-color: #5865f2;
            border-radius: 16px;
        }

        .server-icon.home {
            background-color: #5865f2;
        }

        .server-indicator {
            position: absolute;
            left: -4px;
            width: 8px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 0 4px 4px 0;
        }

        /* Channels Sidebar */
        .channels-sidebar {
            width: 240px;
            background-color: #2f3136;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #202225;
        }

        .channels-header {
            padding: 16px;
            border-bottom: 1px solid #202225;
            font-weight: 600;
            font-size: 16px;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
        }

        .channel-category {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #8e9297;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 16px;
        }

        .channel-item {
            padding: 6px 8px 6px 16px;
            margin: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.1s;
        }

        .channel-item:hover {
            background-color: #36393f;
        }

        .channel-item.active {
            background-color: #40444b;
            color: #ffffff;
        }

        .channel-icon {
            margin-right: 8px;
            font-size: 16px;
        }

        .channel-name {
            flex: 1;
        }

        .channel-unread {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-left: auto;
        }

        /* Main Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #36393f;
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            border-bottom: 1px solid #202225;
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .chat-channel-name {
            font-size: 16px;
        }

        .chat-members-count {
            margin-left: 8px;
            font-size: 12px;
            color: #b9bbbe;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .message-group {
            margin-bottom: 16px;
            display: flex;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #7289da;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .message-author {
            font-weight: 600;
            color: #ffffff;
            margin-right: 8px;
        }

        .message-timestamp {
            font-size: 12px;
            color: #72767d;
        }

        .message-text {
            color: #dcddde;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-own {
            background-color: rgba(250, 166, 26, 0.1);
            margin-left: auto;
            margin-right: 0;
        }

        .message-own .message-content {
            text-align: right;
        }

        /* Chat Input */
        .chat-input-container {
            padding: 16px;
            border-top: 1px solid #202225;
        }

        .chat-input {
            width: 100%;
            background-color: #40444b;
            border: 1px solid #202225;
            border-radius: 8px;
            color: #dcddde;
            padding: 12px 16px;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 200px;
            outline: none;
        }

        .chat-input::placeholder {
            color: #72767d;
        }

        .chat-input:focus {
            border-color: #5865f2;
        }

        /* Right Sidebar - Members/Settings */
        .members-sidebar {
            width: 240px;
            background-color: #2f3136;
            border-left: 1px solid #202225;
            display: flex;
            flex-direction: column;
        }

        .members-header {
            padding: 16px;
            border-bottom: 1px solid #202225;
            font-weight: 600;
            font-size: 14px;
        }

        .members-list {
            flex: 1;
            overflow-y: auto;
        }

        .member-item {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .member-item:hover {
            background-color: #36393f;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #7289da;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-size: 14px;
            color: #ffffff;
        }

        .member-status {
            font-size: 12px;
            color: #b9bbbe;
        }

        .member-status.online::before {
            content: '🟢';
            margin-right: 4px;
        }

        /* Settings Panel */
        .settings-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .settings-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #36393f;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid #202225;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 600;
        }

        .settings-close {
            background: none;
            border: none;
            color: #b9bbbe;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .settings-body {
            padding: 20px;
        }

        .setting-group {
            margin-bottom: 24px;
        }

        .setting-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffffff;
        }

        .setting-input {
            width: 100%;
            padding: 8px 12px;
            background-color: #202225;
            border: 1px solid #202225;
            border-radius: 4px;
            color: #dcddde;
            font-size: 14px;
        }

        .setting-input:focus {
            border-color: #5865f2;
            outline: none;
        }

        /* Typing Indicator */
        .typing-indicator {
            padding: 8px 16px;
            font-size: 12px;
            color: #b9bbbe;
            font-style: italic;
        }

        /* Notification Styles */
        .notification {
            background-color: #202225;
            border: 1px solid #5865f2;
            border-radius: 4px;
            padding: 8px 12px;
            margin: 8px 16px;
            font-size: 12px;
            color: #ffffff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .servers-sidebar {
                width: 60px;
            }

            .channels-sidebar,
            .members-sidebar {
                width: 200px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2f3136;
        }

        ::-webkit-scrollbar-thumb {
            background: #202225;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #36393f;
        }
    </style>
</head>

<body>
    <!-- Yahan sirf ek root div hai, baaki sab JS banaega -->
    <!-- Networking Layer 7: Minimal HTML template, sab kuch JS handle karega -->
    <div id="app"></div>

    <!-- SocketIO library include kar rahe hain -->
    <!-- Networking Layer 7: WebSocket connection ke liye external library -->
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <script>
        // Discord-like LAN Saturn Chat App
        // Networking Layer 4: TCP connection establish karna
        // Layer 7: WebSocket protocol for real-time messaging

        class DiscordLikeChat {
            constructor() {
                console.log('DiscordLikeChat constructor called');
                // Global state management
                this.socket = io();
                this.currentUsername = localStorage.getItem('username') || 'Anonymous';
                this.currentServer = 'home'; // 'home', 'dms', or server id
                this.currentChannel = 'general';
                this.servers = {
                    'home': { name: 'LAN Saturn', channels: ['general', 'random', 'tech'] },
                    'dms': { name: 'Direct Messages', channels: [] }
                };
                this.directMessages = {}; // username -> messages array
                this.onlineUsers = [];
                this.typingUsers = new Set();
                this.messageHistory = {};
                this.settings = {
                    theme: localStorage.getItem('theme') || 'dark',
                    notifications: true,
                    soundEnabled: true
                };
                this.isTyping = false;
                this.typingTimeout = null;

                // Initialize UI
                this.createUI();
                this.setupEventListeners();
                this.loadSettings();
                this.initializeServers();
            }

            // Utility function to create DOM elements
            createElement(tag, options = {}) {
                const element = document.createElement(tag);
                Object.keys(options).forEach(key => {
                    if (key === 'className') {
                        element.className = options[key];
                    } else if (key === 'textContent') {
                        element.textContent = options[key];
                    } else if (key === 'style') {
                        element.style.cssText = options[key];
                    } else if (key.startsWith('on')) {
                        element[key] = options[key];
                    } else {
                        element.setAttribute(key, options[key]);
                    }
                });
                return element;
            }

            // Create Discord-like UI structure
            createUI() {
                console.log('createUI called');
                const app = document.getElementById('app');
                console.log('app element:', app);

                if (!app) {
                    console.error('App element not found!');
                    return;
                }

                // Simple test: just add some text
                app.innerHTML = '<h1>LAN Saturn is loading...</h1>';
                console.log('Basic HTML added');

                // Then create the full UI
                this.createFullUI();
            }

            createFullUI() {
                try {
                    console.log('Creating full Discord UI...');
                    const app = document.getElementById('app');
                    app.innerHTML = ''; // Clear the loading message

                    // Main Discord app container
                    const discordApp = this.createElement('div', { className: 'discord-app' });

                    // Left sidebar - Servers
                    discordApp.appendChild(this.createServersSidebar());

                    // Channels sidebar
                    discordApp.appendChild(this.createChannelsSidebar());

                    // Main chat area
                    discordApp.appendChild(this.createChatArea());

                    // Right sidebar - Members/Settings
                    discordApp.appendChild(this.createMembersSidebar());

                    // Settings panel (hidden by default)
                    discordApp.appendChild(this.createSettingsPanel());

                    app.appendChild(discordApp);

                    // Store references
                    this.discordApp = discordApp;
                    this.chatMessages = document.getElementById('chat-messages');
                    this.chatInput = document.getElementById('chat-input');
                    this.membersList = document.getElementById('members-list');
                    this.channelsList = document.getElementById('channels-list');

                    console.log('Full Discord UI created successfully');
                } catch (error) {
                    console.error('Error creating UI:', error);
                    // Fallback to simple UI
                    this.createSimpleUI();
                }
            }

            createSimpleUI() {
                console.log('Falling back to simple UI');
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div style="padding: 20px; background: #36393f; color: white; height: 100vh;">
                        <h1>LAN Saturn - Basic Mode</h1>
                        <p>Server: ${this.socket ? 'Connected' : 'Disconnected'}</p>
                        <p>Username: ${this.currentUsername}</p>
                        <div id="chat-messages" style="height: 300px; overflow-y: auto; background: #2f3136; padding: 10px; margin: 10px 0; border-radius: 5px;"></div>
                        <textarea id="chat-input" placeholder="Type a message..." style="width: 100%; height: 50px; background: #40444b; color: white; border: none; padding: 10px; border-radius: 5px;"></textarea>
                        <button onclick="window.chatApp.sendMessage()" style="margin-top: 10px; padding: 10px 20px; background: #5865f2; color: white; border: none; border-radius: 5px;">Send</button>
                    </div>
                `;

                // Store references
                this.chatMessages = document.getElementById('chat-messages');
                this.chatInput = document.getElementById('chat-input');

                // Setup input handler
                this.chatInput.onkeypress = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                };
            }

            // Create servers sidebar (leftmost)
            createServersSidebar() {
                try {
                    console.log('Creating servers sidebar');
                    const sidebar = this.createElement('div', { className: 'servers-sidebar' });

                    // Home server
                    const homeServer = this.createElement('div', {
                        className: 'server-icon home',
                        textContent: '🏠',
                        onclick: () => this.switchServer('home')
                    });
                    sidebar.appendChild(homeServer);

                    // DMs server
                    const dmsServer = this.createElement('div', {
                        className: 'server-icon',
                        textContent: '💬',
                        onclick: () => this.switchServer('dms')
                    });
                    sidebar.appendChild(dmsServer);

                    // Add server button
                    const addServer = this.createElement('div', {
                        className: 'server-icon',
                        textContent: '+',
                        title: 'Add Server',
                        onclick: () => this.addServer()
                    });
                    sidebar.appendChild(addServer);

                    return sidebar;
                } catch (error) {
                    console.error('Error creating servers sidebar:', error);
                    return this.createElement('div', { className: 'servers-sidebar' });
                }
            }

            // Create channels sidebar
            createChannelsSidebar() {
                try {
                    const sidebar = this.createElement('div', { className: 'channels-sidebar' });

                    // Server header
                    const header = this.createElement('div', { className: 'channels-header' });
                    header.textContent = 'LAN Saturn';
                    sidebar.appendChild(header);

                    // Channels list
                    const channelsList = this.createElement('div', { className: 'channels-list', id: 'channels-list' });

                    // Text channels category
                    const textCategory = this.createElement('div', { className: 'channel-category' });
                    textCategory.textContent = 'TEXT CHANNELS';
                    channelsList.appendChild(textCategory);

                    // Add default channels
                    ['general', 'random', 'tech'].forEach(channel => {
                        channelsList.appendChild(this.createChannelItem(channel, 'text'));
                    });

                    sidebar.appendChild(channelsList);

                    // User settings at bottom
                    const userSettings = this.createElement('div', {
                        className: 'member-item',
                        style: 'position: absolute; bottom: 0; left: 0; right: 0; border-top: 1px solid #202225;',
                        onclick: () => this.openSettings()
                    });
                    userSettings.innerHTML = `
                        <div class="member-avatar">${this.currentUsername.charAt(0).toUpperCase()}</div>
                        <div class="member-info">
                            <div class="member-name">${this.currentUsername}</div>
                            <div class="member-status">#${this.currentChannel}</div>
                        </div>
                    `;
                    sidebar.appendChild(userSettings);

                    return sidebar;
                } catch (error) {
                    console.error('Error creating channels sidebar:', error);
                    return this.createElement('div', { className: 'channels-sidebar' });
                }
            }

            // Create channel item
            createChannelItem(channelName, type) {
                const item = this.createElement('div', {
                    className: 'channel-item',
                    onclick: () => this.switchChannel(channelName)
                });

                const icon = this.createElement('div', { className: 'channel-icon' });
                icon.textContent = type === 'text' ? '#' : '🔊';

                const name = this.createElement('div', { className: 'channel-name' });
                name.textContent = channelName;

                item.appendChild(icon);
                item.appendChild(name);

                return item;
            }

            // Create main chat area
            createChatArea() {
                try {
                    const chatArea = this.createElement('div', { className: 'chat-main' });

                    // Chat header
                    const header = this.createElement('div', { className: 'chat-header' });
                    const channelName = this.createElement('div', { className: 'chat-channel-name' });
                    channelName.textContent = `#${this.currentChannel}`;
                    const memberCount = this.createElement('div', { className: 'chat-members-count' });
                    memberCount.textContent = '0 members';
                    header.appendChild(channelName);
                    header.appendChild(memberCount);
                    chatArea.appendChild(header);

                    // Messages area
                    const messages = this.createElement('div', { className: 'chat-messages', id: 'chat-messages' });
                    chatArea.appendChild(messages);

                    // Typing indicator
                    const typingIndicator = this.createElement('div', {
                        className: 'typing-indicator',
                        id: 'typing-indicator',
                        style: 'display: none;'
                    });
                    chatArea.appendChild(typingIndicator);

                    // Chat input container
                    const inputContainer = this.createElement('div', { className: 'chat-input-container' });
                    const input = this.createElement('textarea', {
                        className: 'chat-input',
                        id: 'chat-input',
                        placeholder: `Message #${this.currentChannel}`,
                        onkeydown: (e) => this.handleChatInput(e),
                        oninput: () => this.handleTyping()
                    });
                    inputContainer.appendChild(input);
                    chatArea.appendChild(inputContainer);

                    return chatArea;
                } catch (error) {
                    console.error('Error creating chat area:', error);
                    return this.createElement('div', { className: 'chat-main' });
                }
            }

            // Create members sidebar
            createMembersSidebar() {
                try {
                    const sidebar = this.createElement('div', { className: 'members-sidebar' });

                    // Members header
                    const header = this.createElement('div', { className: 'members-header' });
                    header.textContent = 'Online - 0';
                    sidebar.appendChild(header);

                    // Members list
                    const membersList = this.createElement('div', { className: 'members-list', id: 'members-list' });
                    sidebar.appendChild(membersList);

                    return sidebar;
                } catch (error) {
                    console.error('Error creating members sidebar:', error);
                    return this.createElement('div', { className: 'members-sidebar' });
                }
            }

            // Create settings panel
            createSettingsPanel() {
                try {
                    const panel = this.createElement('div', { className: 'settings-panel', id: 'settings-panel' });

                    const content = this.createElement('div', { className: 'settings-content' });

                    // Header
                    const header = this.createElement('div', { className: 'settings-header' });
                    const title = this.createElement('div', { className: 'settings-title' });
                    title.textContent = 'User Settings';
                    const closeBtn = this.createElement('button', {
                        className: 'settings-close',
                        textContent: '×',
                        onclick: () => this.closeSettings()
                    });
                    header.appendChild(title);
                    header.appendChild(closeBtn);
                    content.appendChild(header);

                    // Body
                    const body = this.createElement('div', { className: 'settings-body' });

                    // Username setting
                    const usernameGroup = this.createElement('div', { className: 'setting-group' });
                    const usernameLabel = this.createElement('label', { className: 'setting-label' });
                    usernameLabel.textContent = 'Username';
                    const usernameInput = this.createElement('input', {
                        className: 'setting-input',
                        type: 'text',
                        value: this.currentUsername,
                        oninput: (e) => this.updateUsername(e.target.value)
                    });
                    usernameGroup.appendChild(usernameLabel);
                    usernameGroup.appendChild(usernameInput);
                    body.appendChild(usernameGroup);

                    // Theme setting
                    const themeGroup = this.createElement('div', { className: 'setting-group' });
                    const themeLabel = this.createElement('label', { className: 'setting-label' });
                    themeLabel.textContent = 'Theme';
                    const themeSelect = this.createElement('select', { className: 'setting-input' });
                    ['dark', 'light'].forEach(theme => {
                        const option = this.createElement('option', {
                            value: theme,
                            textContent: theme.charAt(0).toUpperCase() + theme.slice(1),
                            selected: this.settings.theme === theme
                        });
                        themeSelect.appendChild(option);
                    });
                    themeSelect.onchange = (e) => this.changeTheme(e.target.value);
                    themeGroup.appendChild(themeLabel);
                    themeGroup.appendChild(themeSelect);
                    body.appendChild(themeGroup);

                    // Notifications setting
                    const notifGroup = this.createElement('div', { className: 'setting-group' });
                    const notifLabel = this.createElement('label', { className: 'setting-label' });
                    notifLabel.textContent = 'Enable Notifications';
                    const notifCheckbox = this.createElement('input', {
                        type: 'checkbox',
                        checked: this.settings.notifications,
                        onchange: (e) => this.settings.notifications = e.target.checked
                    });
                    notifGroup.appendChild(notifLabel);
                    notifGroup.appendChild(notifCheckbox);
                    body.appendChild(notifGroup);

                    // Sound setting
                    const soundGroup = this.createElement('div', { className: 'setting-group' });
                    const soundLabel = this.createElement('label', { className: 'setting-label' });
                    soundLabel.textContent = 'Enable Sound';
                    const soundCheckbox = this.createElement('input', {
                        type: 'checkbox',
                        checked: this.settings.soundEnabled,
                        onchange: (e) => this.settings.soundEnabled = e.target.checked
                    });
                    soundGroup.appendChild(soundLabel);
                    soundGroup.appendChild(soundCheckbox);
                    body.appendChild(soundGroup);

                    content.appendChild(body);
                    panel.appendChild(content);

                    return panel;
                } catch (error) {
                    console.error('Error creating settings panel:', error);
                    return this.createElement('div', { className: 'settings-panel', id: 'settings-panel' });
                }
            }

            // Setup Socket.IO event listeners
            setupEventListeners() {
                console.log('Setting up Socket.IO event listeners');

                // Connection established
                this.socket.on('connect', () => {
                    console.log('Connected to server');
                    this.socket.emit('join', { username: this.currentUsername });
                });

                // User joined
                this.socket.on('user_joined', (data) => {
                    console.log('User joined:', data.username);
                    this.displayNotification(`${data.username} joined the server`);
                    if (this.settings.soundEnabled) this.playNotificationSound();
                });

                // User left
                this.socket.on('user_left', (data) => {
                    console.log('User left:', data.username);
                    this.displayNotification(`${data.username} left the server`);
                });

                // Receive message
                this.socket.on('receive_message', (data) => {
                    console.log('Received message:', data);
                    this.displayMessage(data.username, data.message, data.timestamp);
                    if (this.settings.notifications && this.settings.soundEnabled) {
                        this.playNotificationSound();
                    }
                });

                // Private message
                this.socket.on('private_message', (data) => {
                    console.log('Received private message:', data);
                    this.handlePrivateMessage(data);
                });

                // User list updates
                this.socket.on('user_list', (data) => {
                    console.log('User list update:', data);
                    this.onlineUsers = data.users;
                    this.updateMembersList();
                });

                // Typing indicators
                this.socket.on('user_typing', (data) => {
                    this.typingUsers.add(data.username);
                    this.updateTypingIndicator();
                });

                this.socket.on('user_stopped_typing', (data) => {
                    this.typingUsers.delete(data.username);
                    this.updateTypingIndicator();
                });
            }

            // Private message handling
            handlePrivateMessage(data) {
                const { from, message, timestamp } = data;

                // Initialize DM history if needed
                if (!this.directMessages[from]) {
                    this.directMessages[from] = [];
                    this.updateChannelsList();
                }

                // Add to DM history
                this.directMessages[from].push({
                    username: from,
                    message,
                    timestamp,
                    isOwn: false
                });

                // Show notification if not in that DM
                if (this.currentServer !== 'dms' || this.currentChannel !== from) {
                    this.displayNotification(`DM from ${from}`);
                }

                // Display if in the correct DM
                if (this.currentServer === 'dms' && this.currentChannel === from) {
                    this.displayMessage(from, message, timestamp);
                }

                if (this.settings.soundEnabled) this.playNotificationSound();
            }

            // Server and channel switching
            switchServer(serverId) {
                console.log('Switching to server:', serverId);
                this.currentServer = serverId;
                this.currentChannel = serverId === 'dms' ? Object.keys(this.directMessages)[0] || 'general' : 'general';
                this.updateChannelsList();
                this.loadMessages();
            }

            switchChannel(channelName) {
                console.log('Switching to channel:', channelName);
                this.currentChannel = channelName;
                this.loadMessages();
                this.updateChannelHeader();
            }

            switchToDM(username) {
                this.currentServer = 'dms';
                this.currentChannel = username;
                this.updateChannelsList();
                this.loadDMHistory(username);
            }

            // Message display and handling
            displayMessage(username, message, timestamp, isOwn = false) {
                if (!this.chatMessages) return;

                const messageDiv = this.createElement('div', {
                    className: `message-group ${isOwn ? 'message-own' : ''}`
                });

                const contentDiv = this.createElement('div', { className: 'message-content' });

                const headerDiv = this.createElement('div', { className: 'message-header' });
                const authorDiv = this.createElement('div', { className: 'message-author' });
                authorDiv.textContent = username;
                const timeDiv = this.createElement('div', { className: 'message-timestamp' });
                timeDiv.textContent = new Date(timestamp).toLocaleTimeString();
                headerDiv.appendChild(authorDiv);
                headerDiv.appendChild(timeDiv);

                const textDiv = this.createElement('div', { className: 'message-text' });
                textDiv.innerHTML = this.formatMessage(message);

                contentDiv.appendChild(headerDiv);
                contentDiv.appendChild(textDiv);
                messageDiv.appendChild(contentDiv);

                this.chatMessages.appendChild(messageDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            formatMessage(message) {
                // Simple formatting: **bold**, *italic*, `code`
                return message
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code>$1</code>');
            }

            displayNotification(message) {
                const notification = this.createElement('div', { className: 'notification' });
                notification.textContent = message;
                this.chatMessages.appendChild(notification);

                // Auto-remove after 5 seconds
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 5000);
            }

            // Input handling
            handleChatInput(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    this.sendMessage();
                }
            }

            sendMessage() {
                if (!this.chatInput) return;

                const message = this.chatInput.value.trim();
                if (!message) return;

                const timestamp = new Date().toISOString();

                if (this.currentServer === 'dms') {
                    // Send private message
                    this.socket.emit('private_message', {
                        to: this.currentChannel,
                        message: message,
                        from: this.currentUsername,
                        timestamp: timestamp
                    });

                    // Add to local DM history
                    if (!this.directMessages[this.currentChannel]) {
                        this.directMessages[this.currentChannel] = [];
                    }
                    this.directMessages[this.currentChannel].push({
                        username: this.currentUsername,
                        message,
                        timestamp,
                        isOwn: true
                    });

                    this.displayMessage(this.currentUsername, message, timestamp, true);
                } else {
                    // Send public message
                    this.socket.emit('send_message', {
                        username: this.currentUsername,
                        message: message,
                        channel: this.currentChannel,
                        timestamp: timestamp
                    });

                    // Save to channel history
                    const channelKey = `${this.currentServer}_${this.currentChannel}`;
                    if (!this.messageHistory[channelKey]) {
                        this.messageHistory[channelKey] = [];
                    }
                    this.messageHistory[channelKey].push({
                        username: this.currentUsername,
                        message,
                        timestamp,
                        isOwn: true
                    });

                    this.displayMessage(this.currentUsername, message, timestamp, true);
                }

                this.chatInput.value = '';
                this.socket.emit('typing_stop', { username: this.currentUsername });
            }

            handleTyping() {
                if (!this.isTyping) {
                    this.socket.emit('typing_start', { username: this.currentUsername });
                    this.isTyping = true;
                }

                clearTimeout(this.typingTimeout);
                this.typingTimeout = setTimeout(() => {
                    this.socket.emit('typing_stop', { username: this.currentUsername });
                    this.isTyping = false;
                }, 1000);
            }

            updateTypingIndicator() {
                const indicator = document.getElementById('typing-indicator');
                if (!indicator) return;

                if (this.typingUsers.size > 0) {
                    const users = Array.from(this.typingUsers);
                    const text = users.length === 1
                        ? `${users[0]} is typing...`
                        : `${users.slice(0, -1).join(', ')} and ${users[users.length - 1]} are typing...`;
                    indicator.textContent = text;
                    indicator.style.display = 'block';
                } else {
                    indicator.style.display = 'none';
                }
            }

            // UI Updates
            updateMembersList() {
                if (!this.membersList) return;

                this.membersList.innerHTML = '';

                // Update header
                const header = document.querySelector('.members-header');
                if (header) {
                    header.textContent = `Online - ${this.onlineUsers.length}`;
                }

                // Add online users
                this.onlineUsers.forEach(username => {
                    const memberDiv = this.createElement('div', { className: 'member-item' });
                    memberDiv.onclick = () => this.startDMWithUser(username);

                    const avatar = this.createElement('div', { className: 'member-avatar' });
                    avatar.textContent = username.charAt(0).toUpperCase();

                    const info = this.createElement('div', { className: 'member-info' });
                    const name = this.createElement('div', { className: 'member-name' });
                    name.textContent = username;
                    const status = this.createElement('div', { className: 'member-status online' });
                    status.textContent = 'online';

                    info.appendChild(name);
                    info.appendChild(status);
                    memberDiv.appendChild(avatar);
                    memberDiv.appendChild(info);

                    this.membersList.appendChild(memberDiv);
                });
            }

            updateChannelsList() {
                if (!this.channelsList) return;

                this.channelsList.innerHTML = '';

                if (this.currentServer === 'dms') {
                    // Show DM channels
                    const dmCategory = this.createElement('div', { className: 'channel-category' });
                    dmCategory.textContent = 'DIRECT MESSAGES';
                    this.channelsList.appendChild(dmCategory);

                    Object.keys(this.directMessages).forEach(username => {
                        const dmItem = this.createElement('div', {
                            className: `channel-item ${this.currentChannel === username ? 'active' : ''}`,
                            onclick: () => this.switchToDM(username)
                        });

                        const icon = this.createElement('div', { className: 'channel-icon' });
                        icon.textContent = '💬';

                        const name = this.createElement('div', { className: 'channel-name' });
                        name.textContent = username;

                        dmItem.appendChild(icon);
                        dmItem.appendChild(name);
                        this.channelsList.appendChild(dmItem);
                    });

                    // Add new DM button
                    const newDMItem = this.createElement('div', {
                        className: 'channel-item',
                        onclick: () => this.startNewDM()
                    });

                    const newDMIcon = this.createElement('div', { className: 'channel-icon' });
                    newDMIcon.textContent = '+';

                    const newDMName = this.createElement('div', { className: 'channel-name' });
                    newDMName.textContent = 'Add Friend';

                    newDMItem.appendChild(newDMIcon);
                    newDMItem.appendChild(newDMName);
                    this.channelsList.appendChild(newDMItem);
                } else {
                    // Show server channels
                    const textCategory = this.createElement('div', { className: 'channel-category' });
                    textCategory.textContent = 'TEXT CHANNELS';
                    this.channelsList.appendChild(textCategory);

                    const channels = this.servers[this.currentServer]?.channels || ['general'];
                    channels.forEach(channel => {
                        const channelItem = this.createElement('div', {
                            className: `channel-item ${this.currentChannel === channel ? 'active' : ''}`,
                            onclick: () => this.switchChannel(channel)
                        });

                        const icon = this.createElement('div', { className: 'channel-icon' });
                        icon.textContent = '#';

                        const name = this.createElement('div', { className: 'channel-name' });
                        name.textContent = channel;

                        channelItem.appendChild(icon);
                        channelItem.appendChild(name);
                        this.channelsList.appendChild(channelItem);
                    });
                }
            }

            updateChannelHeader() {
                const channelName = document.querySelector('.chat-channel-name');
                const memberCount = document.querySelector('.chat-members-count');

                if (channelName) {
                    channelName.textContent = this.currentServer === 'dms' ? `@${this.currentChannel}` : `#${this.currentChannel}`;
                }

                if (memberCount) {
                    memberCount.textContent = `${this.onlineUsers.length} members`;
                }
            }

            loadMessages() {
                if (!this.chatMessages) return;

                this.chatMessages.innerHTML = '';

                if (this.currentServer === 'dms') {
                    this.loadDMHistory(this.currentChannel);
                } else {
                    this.loadChannelMessages();
                }

                this.updateChannelHeader();
            }

            loadDMHistory(username) {
                if (this.directMessages[username]) {
                    this.directMessages[username].forEach(msg => {
                        this.displayMessage(msg.username, msg.message, msg.timestamp, msg.isOwn);
                    });
                }
            }

            loadChannelMessages() {
                const channelKey = `${this.currentServer}_${this.currentChannel}`;
                if (this.messageHistory[channelKey]) {
                    this.messageHistory[channelKey].forEach(msg => {
                        this.displayMessage(msg.username, msg.message, msg.timestamp, msg.isOwn);
                    });
                }
            }

            // Settings
            openSettings() {
                const panel = document.getElementById('settings-panel');
                if (panel) panel.style.display = 'block';
            }

            closeSettings() {
                const panel = document.getElementById('settings-panel');
                if (panel) panel.style.display = 'none';
                this.saveSettings();
            }

            updateUsername(newUsername) {
                this.currentUsername = newUsername.trim() || 'Anonymous';
                localStorage.setItem('username', this.currentUsername);
                this.socket.emit('username_change', { username: this.currentUsername });
            }

            changeTheme(theme) {
                this.settings.theme = theme;
                localStorage.setItem('theme', theme);
                document.body.className = theme === 'light' ? 'light-theme' : '';
            }

            loadSettings() {
                const savedSettings = localStorage.getItem('lanSaturn_settings');
                if (savedSettings) {
                    this.settings = { ...this.settings, ...JSON.parse(savedSettings) };
                }
                this.changeTheme(this.settings.theme);
            }

            saveSettings() {
                localStorage.setItem('lanSaturn_settings', JSON.stringify(this.settings));
            }

            // Additional features
            startDMWithUser(username) {
                if (!this.directMessages[username]) {
                    this.directMessages[username] = [];
                }
                this.switchToDM(username);
            }

            startNewDM() {
                const username = prompt('Enter username to DM:');
                if (username && username.trim()) {
                    this.startDMWithUser(username.trim());
                }
            }

            addServer() {
                const serverName = prompt('Enter server name:');
                if (serverName && serverName.trim()) {
                    const serverId = 'server_' + Date.now();
                    this.servers[serverId] = {
                        name: serverName.trim(),
                        channels: ['general']
                    };
                    this.saveServers();
                    this.updateServersList();
                }
            }

            saveServers() {
                localStorage.setItem('lanSaturn_servers', JSON.stringify(this.servers));
            }

            updateServersList() {
                // This would update the servers sidebar with new servers
                // For now, just refresh the current view
                this.updateChannelsList();
            }

            initializeServers() {
                // Load saved servers from localStorage
                const savedServers = localStorage.getItem('lanSaturn_servers');
                if (savedServers) {
                    this.servers = { ...this.servers, ...JSON.parse(savedServers) };
                }
            }

            // Sound notification
            playNotificationSound() {
                try {
                    // Create a simple beep sound using Web Audio API
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);

                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } catch (error) {
                    console.log('Sound notification failed:', error);
                }
            }
        }

        // Initialize the Discord-like chat app
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing chat app');
            window.chatApp = new DiscordLikeChat();
        });

        // Also try to initialize immediately in case DOMContentLoaded already fired
        if (document.readyState === 'loading') {
            // DOM not ready yet
        } else {
            // DOM already loaded
            console.log('DOM already loaded, initializing immediately');
            window.chatApp = new DiscordLikeChat();
        }
    </script>
</body>

</html>
